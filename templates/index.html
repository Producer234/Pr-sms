<!DOCTYPE html>
<html>
<head>
    <title>SMS Bomber</title>
</head>
<body>
    <h1>SMS Bomber</h1>
    <form id="attackForm">
        <label>Phone Number (with country code, e.g., 8801xxxx for BD):</label>
        <input type="text" id="number" required><br><br>

        <label>Country:</label>
        <select id="country">
            <option value="bd">Bangladesh</option>
            <option value="in">India</option>
            <option value="pk">Pakistan</option>
        </select><br><br>

        <label>Number of SMS:</label>
        <input type="number" id="count" value="10" min="1"><br><br>

        <button type="button" onclick="startAttack()">Start</button>
        <button type="button" onclick="stopAttack()">Stop</button>
    </form>

    <h2>Status</h2>
    <div id="status">Idle</div>
    <div id="stats">Sent: 0 / Success: 0 / Total: 0</div>
    <div id="logs"></div>

    <script>
        function startAttack() {
            const num = document.getElementById('number').value;
            const count = document.getElementById('count').value;
            const country = document.getElementById('country').value;
            fetch('/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({num, count, country})
            }).then(r => r.json()).then(d => console.log(d));
        }

        function stopAttack() {
            fetch('/stop', {method: 'POST'}).then(r => r.json()).then(d => console.log(d));
        }

        function updateStatus() {
            fetch('/status').then(r => r.json()).then(d => {
                document.getElementById('status').innerText = d.active ? 'Active' : 'Stopped';
                document.getElementById('stats').innerText = `Sent: ${d.sent} / Success: ${d.success} / Total: ${d.total}`;
                const logsDiv = document.getElementById('logs');
                logsDiv.innerHTML = d.logs.map(l => `<div>${l}</div>`).join('');
            });
        }
        setInterval(updateStatus, 1000);
    </script>
</body>
</html>
